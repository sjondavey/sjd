name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool checkout, not the port baseline in vcpkg.json. MSYS2 deletes old
  # packages from its mirrors, and this commit's scripts still request one
  # that is hosted. Library versions stay on the builtin-baseline.
  VCPKG_COMMIT: 6fa128f2b6e1dd260ebfb30fdb1c38a191369812
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff
      - name: ruff check
        run: ruff check python docs
      - name: clang-format
        run: |
          python -m pip install clang-format==18.1.8
          git ls-files -z '*.h' '*.hpp' '*.cpp' | xargs -0 clang-format --dry-run --Werror

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: debug, triplet: x64-windows-static-md }
          - { os: windows-2022, preset: release, triplet: x64-windows-static-md }
          - { os: ubuntu-24.04, preset: linux-debug, triplet: x64-linux }
          - { os: ubuntu-24.04, preset: linux-release, triplet: x64-linux }
          # C++ tests only, built with AddressSanitizer and UBSan.
          - { os: ubuntu-24.04, preset: linux-asan, triplet: x64-linux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python tools
        run: python -m pip install ninja pybind11 numpy pytest pybind11-stubgen mypy pandas openpyxl scipy nbmake matplotlib ipykernel QuantLib

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The MSVC developer prompt overwrites VCPKG_ROOT with Visual Studio's own copy.
      - name: Pin vcpkg to the workspace
        shell: bash
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      # MSVC /W4 is clean, so warnings fail the Windows jobs. Linux -Wpedantic is not clean yet.
      # Linux debug is the gcov build. The report is uploaded after the tests.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPython3_EXECUTABLE="${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}" -DSJD_WARNINGS_AS_ERRORS=${{ runner.os == 'Windows' && 'ON' || 'OFF' }} ${{ matrix.preset == 'linux-debug' && '-DSJD_COVERAGE=ON' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          # Leak checking is off until QuantLib singletons are suppressed.
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}

      # One job executes the teaching notebooks against the staged package.
      - name: Notebooks
        if: matrix.preset == 'linux-release'
        env:
          PYTHONPATH: ${{ github.workspace }}/build/linux-release/python
          MPLBACKEND: Agg
        run: python -m pytest --nbmake python/notebooks -q --nbmake-timeout=180

      # The staged package has the generated _core.pyi. The source tree does not.
      - name: mypy
        if: matrix.preset != 'linux-asan'
        env:
          MYPYPATH: ${{ github.workspace }}/build/${{ matrix.preset }}/python
        run: python -m mypy --package sjd

      # One job builds the MkDocs site and the Doxygen reference.
      - name: Documentation
        if: matrix.preset == 'linux-release'
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          python -m pip install mkdocs 'mkdocstrings[python]' 'pymdown-extensions>=10.13,<10.15'
          SJD_PYTHON_STAGE=${{ github.workspace }}/build/linux-release/python python -m mkdocs build --strict
          doxygen docs/Doxyfile

      - name: Linux coverage report
        if: matrix.preset == 'linux-debug'
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          # gcov reports a negative hit count inside a Boost header. That tree is
          # removed on the next line. lcov 2 applies one ignore entry to only one
          # of lcov and geninfo, so the category is listed twice.
          lcov --capture --directory build/linux-debug --output-file coverage.raw --ignore-errors negative,negative
          lcov --remove coverage.raw '/usr/*' '*/vcpkg_installed/*' --output-file coverage.info
          genhtml coverage.info --output-directory coverage-html

      - name: Upload Linux coverage
        if: matrix.preset == 'linux-debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-debug
          path: coverage-html

      - name: Windows coverage report
        if: matrix.preset == 'debug'
        shell: pwsh
        run: |
          choco install opencppcoverage --no-progress -y
          # Current Chocolatey builds install the executable and do not leave a shim here.
          $coverage = Get-ChildItem -Path "${env:ProgramFiles}\OpenCppCoverage" -Filter OpenCppCoverage.exe -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $coverage) { throw "OpenCppCoverage.exe was not found after install" }
          & $coverage --quiet `
            --sources "${{ github.workspace }}\src" `
            --sources "${{ github.workspace }}\include" `
            --excluded_sources ".*vcpkg_installed.*" `
            --export_type "html:${{ github.workspace }}\coverage-html" `
            -- "${{ github.workspace }}\build\debug\sjdTest.exe" --log_level=error --report_level=no

      - name: Upload Windows coverage
        if: matrix.preset == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-windows-debug
          path: coverage-html

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore

  # Release wheels. QuantLib is built again inside this job. CPython 3.10 only.
  wheels:
    name: wheel ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted Windows images already contain C:/vcpkg, so this job clones its own copy.
          - { os: windows-2022, build: cp310-win_amd64, vcpkg_root: "C:/sjd-vcpkg", bootstrap: "C:/sjd-vcpkg/bootstrap-vcpkg.bat" }
          - { os: ubuntu-24.04, build: cp310-manylinux_x86_64, vcpkg_root: "/tmp/vcpkg", bootstrap: "/tmp/vcpkg/bootstrap-vcpkg.sh" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: cibuildwheel
        run: python -m pip install cibuildwheel

      # The Linux build runs inside the manylinux container, so vcpkg is cloned
      # there. CIBW_BEFORE_ALL is that container's shell on Linux and cmd on Windows.
      - name: Point the wheel build at vcpkg
        shell: bash
        run: |
          root="${{ matrix.vcpkg_root }}"
          boot="${{ matrix.bootstrap }}"
          echo "CIBW_BUILD=${{ matrix.build }}" >> "$GITHUB_ENV"
          echo "CIBW_ENVIRONMENT=VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          echo "CIBW_BEFORE_ALL=git clone https://github.com/microsoft/vcpkg.git $root && git -C $root checkout $VCPKG_COMMIT && $boot -disableMetrics" >> "$GITHUB_ENV"

      - name: Build wheels
        run: python -m cibuildwheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.build }}
          path: wheelhouse/*.whl
