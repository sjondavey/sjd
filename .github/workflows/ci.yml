name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg commit matching builtin-baseline in vcpkg.json.
  VCPKG_COMMIT: 26abb5b33f976246a5f2cdc45cdd073d51caff06
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install ruff
      - name: ruff check
        working-directory: python
        run: ruff check .
      - name: clang-format
        run: |
          python -m pip install clang-format==18.1.8
          git ls-files -z '*.h' '*.hpp' '*.cpp' | xargs -0 clang-format --dry-run --Werror

  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: debug, triplet: x64-windows-static-md }
          - { os: windows-2022, preset: release, triplet: x64-windows-static-md }
          - { os: ubuntu-24.04, preset: linux-debug, triplet: x64-linux }
          - { os: ubuntu-24.04, preset: linux-release, triplet: x64-linux }
          # C++ tests only, built with AddressSanitizer and UBSan.
          - { os: ubuntu-24.04, preset: linux-asan, triplet: x64-linux }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python tools
        run: python -m pip install ninja pybind11 numpy pytest

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The MSVC developer prompt overwrites VCPKG_ROOT with Visual Studio's own copy.
      - name: Pin vcpkg to the workspace
        shell: bash
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      # MSVC /W4 is clean, so warnings fail the Windows jobs. Linux -Wpedantic is not clean yet.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DPython3_EXECUTABLE="${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}" -DSJD_WARNINGS_AS_ERRORS=${{ runner.os == 'Windows' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          # Leak checking is off until QuantLib singletons are suppressed.
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
          if-no-files-found: ignore
