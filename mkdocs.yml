site_name: sjd
site_description: Commodity derivative pricing and Monte Carlo statistics
docs_dir: docs
site_dir: site

hooks:
  - docs/hooks.py

validation:
  omitted_files: ignore

exclude_docs: |
  documentation.md
  MODERNISATION_TODO.md
  notebook-plan.md
  python-front-end.md
  python-bindings.md
  python-packaging.md
  simulation-engine.md
  rates-layer.md
  capital-model.md
  cpp-tests.md
  immutable-contracts.md

nav:
  - Home: index.md
  - Architecture: architecture.md
  - CEM capital: cem.md
  - Error handling: error-handling.md
  - Issue codes: issue-codes.md
  - Python API: api/python.md
  - Bindings: api/bindings.md
  - C++ API: api/cpp.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: auto
            show_root_heading: true
            show_source: false
            show_bases: false
            members_order: source
            heading_level: 2
            show_if_no_docstring: true
            filters:
              - "!^_"

markdown_extensions:
  - tables
  - toc:
      permalink: true
